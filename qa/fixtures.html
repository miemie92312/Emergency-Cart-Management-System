<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合成数据验证台（不随产品发布）</title><style>body{max-width:760px;margin:30px auto;padding:20px;font:16px/1.7 sans-serif}button{padding:12px;margin:8px}pre{white-space:pre-wrap;background:#eef3f4;padding:16px}</style><h1>仅合成数据验证</h1><p>测试台不会覆盖已有旧库；事务测试使用独立随机 QA 数据库并在测试后清理。此页不进入生产构建。</p><button id="transaction">运行真实浏览器事务验证</button><button id="legacy">创建合成旧库（不存在时）</button><a href="/">返回产品</a><pre id="result">尚未运行</pre><script type="module">
import {restoreLegacy,readLegacySnapshot,requestStore} from '../src/legacy-safety.js';
const out=document.querySelector('#result');
async function open(name){return new Promise((resolve,reject)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>{r.result.createObjectStore('drugs',{keyPath:'id'});r.result.createObjectStore('checks',{keyPath:'id'});r.result.createObjectStore('settings',{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
const payload={drugs:[{id:'qa-old-1',name:'合成旧药品 A',specification:'合成规格',quantity:2,minimumQuantity:5,batchNumber:'00001',expiryDate:'2027-06-15',unknownBusinessField:'原值完整保留'},{id:1,name:'合成旧药品 B',quantity:1,minimumQuantity:3,expiryDate:'2027-06'}],checks:[{id:'qa-old-check',drugId:'missing-original',checker:'合成旧登记人',checkedAt:new Date().toISOString(),remark:'仅模拟旧版孤立历史'}],settings:{warningDays:7,lastChecker:'合成旧登记人',unknownSetting:'保留'}};
document.querySelector('#transaction').onclick=async()=>{const db=await open('QA-only-'+crypto.randomUUID());const messages=[];try{
const initial={drugs:[{id:'old',name:'合成物品',quantity:1}],checks:[],settings:{warningDays:30}};await restoreLegacy(db,initial);
let rejected=false;try{await requestStore(db,'drugs','readwrite',(store,tx)=>{const r=store.put({id:'new'});r.addEventListener('success',()=>tx.abort());return r;});}catch(err){rejected=true;}if(!rejected)throw Error('错误接受中止');messages.push('PASS 请求成功后 abort 被拒绝');
if(JSON.stringify(await readLegacySnapshot(db))!==JSON.stringify(initial))throw Error('中止后原库改变');messages.push('PASS 中止后原数据不变');
rejected=false;try{await restoreLegacy(db,{drugs:[{id:'same'},{id:'same'}],checks:[],settings:{}});}catch(err){rejected=true;}if(!rejected)throw Error('错误接受重复 ID');messages.push('PASS 清空后中途写入失败被拒绝');
if(JSON.stringify(await readLegacySnapshot(db))!==JSON.stringify(initial))throw Error('恢复失败后原库改变');messages.push('PASS clear 和首条写入整体回滚');
out.textContent=messages.join('\n');}catch(err){out.textContent='FAIL '+err.message;}finally{const name=db.name;db.close();indexedDB.deleteDatabase(name);}};
document.querySelector('#legacy').onclick=async()=>{try{const databases=await indexedDB.databases();if(databases.some(x=>x.name==='RescueCartDB'))throw Error('旧库已存在，拒绝覆盖。');const db=await open('RescueCartDB');await restoreLegacy(db,payload);db.close();out.textContent='已创建合成 RescueCartDB：2 条物品、1 条孤立旧登记、未知字段和年月效期。未写入任何医院真实配置。';}catch(err){out.textContent=err.message;}};
</script></html>
