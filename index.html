<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#195b70">
  <meta name="description" content="护士个人使用的抢救车管理辅助工作台，支持清单、批次、效期、逐项记录与本地备份。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>抢救车管理助手</title>
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <div class="review-bar"><span><b>抢救车管理助手</b></span><span id="connection" class="save-indicator">正在读取本机数据</span></div>
  <div id="update-banner" hidden>发现新版本，请先保存当前录入。<button type="button" id="apply-update">更新页面</button></div>
  <div class="workspace">
    <aside class="review-panel" aria-label="工作台导航">
      <h1>抢救车管理助手</h1>
      <p>为日常清点留一份清楚的记录。</p>
      <div class="page-map" style="margin-top:28px">
        <button data-action="nav" data-page="home">我的工作台</button>
        <button data-action="nav" data-page="list">抢救车物品清单</button>
        <button data-action="nav" data-page="settings">配置与数据</button>
      </div>
      <div class="review-note">从空白清单开始。物品、规格、数量与检查项目由使用者按已确认要求维护。</div>
      <p class="aside-fine">仅本浏览器存储，无登录、云同步或 AI。辅助记录不能直接替代医院正式检查与交接。</p>
    </aside>
    <div class="device-area">
      <div class="device-caption"><span id="page-caption">工作台</span><span>个人辅助工作台</span></div>
      <div class="app-frame">
        <div class="simulation-notice">数据仅保存在当前浏览器，请定期导出 JSON 备份。</div>
        <header id="app-header" class="app-header"></header>
        <main id="screen" tabindex="-1"><p class="loading">正在读取本机数据…</p></main>
        <nav class="bottom-nav" aria-label="主要导航">
          <button data-action="nav" data-page="home"><span aria-hidden="true">⌂</span>工作台</button>
          <button data-action="nav" data-page="list"><span aria-hidden="true">☷</span>物品清单</button>
          <button data-action="nav" data-page="settings"><span aria-hidden="true">⚙</span>配置</button>
        </nav>
      </div>
    </div>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-heading"><h2 id="sheet-title"></h2><button type="button" class="close-button" data-action="close-sheet" aria-label="关闭弹窗">×</button></div><div id="sheet-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
